name: Validate and deploy A3 submission

on:
  push:
    branches:
      - a3-submission
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maylamdi-a3-submission
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_onxmvi5aOyVqqCuAdwzG67zP
  VERCEL_PROJECT_ID: prj_as1ospOcRHpeAsn0sbBtvL1JvOaQ

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy isolated A3 site
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: a3-submission
      url: https://maylamdi-a3.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm deployment credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The VERCEL_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Link isolated A3 Vercel project
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy A3 production
        run: npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"
