name: Validate and deploy production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maylamdi-production
  cancel-in-progress: false

jobs:
  validate:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  deploy:
    name: Deploy to production
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://maylamdi.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_onxmvi5aOyVqqCuAdwzG67zP
      VERCEL_PROJECT_ID: prj_GYRbqaDGUlM67ubh5F9fNjsBF1vm
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex backend to production
        if: env.CONVEX_DEPLOY_KEY != ''
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy (Vercel builds on their servers using project env vars)
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
