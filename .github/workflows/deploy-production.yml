name: Validate and deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maylamdi-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_onxmvi5aOyVqqCuAdwzG67zP
  VERCEL_PROJECT_ID: prj_GYRbqaDGUlM67ubh5F9fNjsBF1vm

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}

  deploy:
    name: Deploy Vercel and Convex
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://maylamdi.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm deployment credentials
        run: |
          if [ -z $VERCEL_TOKEN ]; then
            echo ::error::The VERCEL_TOKEN repository secret is not configured.
            exit 1
          fi

      - name: Deploy Convex backend
        run: npx convex deploy --cmd 'npm run build'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}

      - name: Link official Vercel project
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Deploy production to Vercel
        run: npx vercel deploy --prod --yes --token=$VERCEL_TOKEN
